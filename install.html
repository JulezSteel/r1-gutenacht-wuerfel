<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gute-Nacht-Würfel installieren</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { font-family: -apple-system, sans-serif; background: #0e0e10; color: #fff;
         display: flex; flex-direction: column; align-items: center; padding: 32px 16px; }
  h1 { font-size: 20px; color: #FE5000; margin-bottom: 8px; }
  p { color: rgba(255,255,255,.7); font-size: 14px; text-align: center; max-width: 340px; }
  #qr { background: #fff; padding: 16px; border-radius: 12px; margin: 20px 0; }
  code { font-size: 12px; color: rgba(255,255,255,.5); word-break: break-all; }
</style>
</head>
<body>
  <h1>🌙 Gute-Nacht-Würfel</h1>
  <p>Am R1 die Kamera öffnen und diesen Code scannen.</p>
  <div id="qr"></div>
  <code id="url"></code>
<script>
  // Version hochzählen, wenn die App aktualisiert wurde (R1 cached die Install-URL)
  var VERSION = 1;
  var appUrl = new URL('./', location.href).href + '?v=' + VERSION;
  document.getElementById('url').textContent = appUrl;
  new QRCode(document.getElementById('qr'), {
    text: JSON.stringify({
      title: 'Gute-Nacht-Würfel',
      url: appUrl,
      description: 'Zutaten drehen, Geschichte hören',
      iconUrl: '',
      themeColor: '#FE5000'
    }),
    width: 260, height: 260, correctLevel: QRCode.CorrectLevel.M
  });
</script>
</body>
</html>
